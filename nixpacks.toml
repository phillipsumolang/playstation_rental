[phases.setup]
nixPkgs = ["php83", "php83Extensions.pdo_mysql", "php83Extensions.mbstring", "php83Extensions.xml", "php83Extensions.curl", "php83Extensions.zip", "php83Extensions.bcmath", "php83Extensions.gd", "php83Extensions.tokenizer", "php83Extensions.dom", "php83Extensions.fileinfo", "nodejs_20", "npm-9_x"]

[phases.install]
cmds = [
    "mkdir -p /etc/nix && echo 'sandbox = false' >> /etc/nix/nix.conf || true",
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm ci"
]

[phases.build]
cmds = [
    "npm run prod",
    "php artisan optimize",
    "php artisan view:cache"
]

[start]
cmd = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
